services:
  - type: web
    name: maderaflow-voice-support
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL
        value: https://maderaflow-voice-support.onrender.com
      - key: MADERAFLOW_TOOL_TOKEN
        sync: false
      # Fail closed until durable storage, retention, and notification delivery
      # are configured for real customer information.
      - key: ORDER_INTAKE_ENABLED
        value: "false"
      - key: ORDER_REVIEWER_NAME
        sync: false
      - key: PERU_INBOUND_NUMBER
        sync: false
      - key: GERMANY_INBOUND_NUMBER
        sync: false
      - key: ORDER_NOTIFICATION_WHATSAPP
        sync: false
